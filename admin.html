<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历专家 · Prompt 后台</title>
  <style>
    :root{--ink:#17202a;--muted:#718096;--line:#e7ebf0;--paper:#fff;--bg:#f6f8fb;--blue:#2563eb;--blue-soft:#eaf1ff;--green:#16845b;--red:#c2414d;--shadow:0 12px 34px rgba(24,38,62,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif} button,input,textarea,select{font:inherit} button{cursor:pointer;border:0;background:none;color:inherit}
    .shell{display:flex;min-height:100vh}.side{width:236px;background:#101820;color:#b6c0cd;padding:24px 16px;display:flex;flex-direction:column}.brand{color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;padding:0 12px 30px}.brand span{display:block;color:#8190a3;font-size:11px;font-weight:400;margin-top:3px}.nav{display:grid;gap:5px}.nav button{padding:11px 12px;text-align:left;border-radius:7px;color:#aeb9c8}.nav button.active,.nav button:hover{background:#202e3d;color:#fff}.nav i{display:inline-block;width:22px;color:#8ca0b7;font-style:normal}.side-foot{margin-top:auto;padding:14px 12px;border-top:1px solid #26323e;color:#76879a;font-size:12px}.main{flex:1;min-width:0}.top{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-weight:600}.account{display:flex;align-items:center;gap:10px}.avatar{width:30px;height:30px;border-radius:50%;background:#dce8ff;color:#2456b7;display:grid;place-items:center;font-weight:700}.wrap{padding:34px 38px;max-width:1450px}.headline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.headline h1{font-size:25px;margin:0 0 5px;letter-spacing:-.3px}.headline p{color:var(--muted);margin:0}.primary{background:var(--blue);color:#fff;border-radius:6px;padding:10px 16px;font-weight:600;box-shadow:0 4px 9px rgba(37,99,235,.18)}.primary:hover{background:#1d4ed8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:7px}.stat small{color:var(--green);font-size:11px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.search{position:relative;flex:1}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid #dce2ea;border-radius:6px;outline:none}.search input:focus{border-color:#8eb0fa;box-shadow:0 0 0 3px var(--blue-soft)}.search span{position:absolute;left:12px;top:9px;color:#93a0b0}.filter{padding:9px 11px;border:1px solid #dce2ea;border-radius:6px;background:white;color:#4e5b6c}.table{width:100%;border-collapse:collapse}.table th{background:#fbfcfd;color:#8490a0;text-align:left;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:12px 18px}.table td{border-top:1px solid #edf0f4;padding:15px 18px;vertical-align:middle}.table tr:hover td{background:#fbfdff}.prompt-name{font-weight:650;color:#1d2936}.prompt-meta{font-size:12px;color:var(--muted);margin-top:2px}.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;background:#f0f3f7;color:#5e6a78;font-size:11px;margin-right:4px}.tag.blue{background:#eaf1ff;color:#285bbc}.status{font-size:12px;display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.status.off{color:#8a96a4}.status.off .dot{background:#b5bec9}.version{color:#536171;font-variant-numeric:tabular-nums}.actions{display:flex;gap:5px;justify-content:flex-end}.iconbtn{padding:6px 8px;border-radius:5px;color:#687587}.iconbtn:hover{background:#eef3fa;color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:45px}
    .drawer-wrap{position:fixed;inset:0;background:rgba(16,24,32,.35);display:none;justify-content:flex-end}.drawer-wrap.open{display:flex}.drawer{width:min(540px,100%);height:100%;background:#fff;padding:28px 30px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.drawer-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:23px}.drawer h2{margin:0;font-size:20px}.close{font-size:24px;color:#8793a2;line-height:1}.field{margin-bottom:17px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px;color:#475467}.field input,.field textarea,.field select{width:100%;border:1px solid #dce2ea;border-radius:6px;padding:10px 11px;outline:none}.field textarea{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.65}.field input:focus,.field textarea:focus{border-color:#8eb0fa;box-shadow:0 0 0 3px var(--blue-soft)}.drawer-foot{display:flex;justify-content:flex-end;gap:9px;padding-top:8px}.secondary{border:1px solid #dce2ea;border-radius:6px;padding:9px 15px;color:#596778}.secondary:hover{background:#f7f9fb}.toast{position:fixed;bottom:24px;right:24px;background:#17202a;color:#fff;padding:11px 15px;border-radius:6px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
    @media(max-width:780px){.side{width:64px;padding:20px 8px}.brand{font-size:0;padding:0 8px 30px}.brand:before{content:'简';font-size:18px;color:#fff}.brand span,.nav button span,.side-foot{display:none}.nav button{padding:12px 10px;text-align:center}.nav i{width:auto}.top{padding:0 18px}.wrap{padding:25px 16px}.stats{grid-template-columns:repeat(2,1fr)}.table th:nth-child(3),.table td:nth-child(3),.table th:nth-child(4),.table td:nth-child(4){display:none}.headline{align-items:flex-start;gap:14px}.headline h1{font-size:21px}.headline .primary{white-space:nowrap}}
  </style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">简历专家<span>Prompt 管理后台</span></div><nav class="nav"><button class="active"><i>▦</i><span>Prompt 总览</span></button><button><i>◷</i><span>变更记录</span></button><button><i>⚙</i><span>项目设置</span></button></nav><div class="side-foot">Workspace · resume-expert<br>v1.4.0</div></aside>
<main class="main"><header class="top"><div class="crumb">工作区 / <b>Prompt 总览</b></div><div class="account"><span>管理员</span><div class="avatar">管</div></div></header><div class="wrap"><div class="headline"><div><h1>Prompt 总览</h1><p>统一查看、维护简历专家在生产环境使用的提示词。</p></div><button class="primary" id="newBtn">＋ 新建 Prompt</button></div>
<section class="stats"><div class="stat"><label>Prompt 总数</label><strong id="total">0</strong><small>当前工作区</small></div><div class="stat"><label>已启用</label><strong id="enabled">0</strong><small>正在提供服务</small></div><div class="stat"><label>近 7 天变更</label><strong id="changes">0</strong><small>含版本发布</small></div><div class="stat"><label>平均响应质量</label><strong>94.8%</strong><small>↑ 2.4% 本周</small></div></section>
<section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索名称、用途或内容" /></div><select class="filter" id="statusFilter"><option value="all">全部状态</option><option value="on">已启用</option><option value="off">已停用</option></select><select class="filter" id="typeFilter"><option value="all">全部类型</option><option value="system">系统 Prompt</option><option value="task">任务 Prompt</option></select></div><table class="table"><thead><tr><th>Prompt</th><th>类型</th><th>状态</th><th>版本</th><th>最后更新</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" style="display:none">没有符合条件的 Prompt</div></section></div></main></div>
<div class="drawer-wrap" id="drawer"><div class="drawer"><div class="drawer-head"><div><h2 id="drawerTitle">编辑 Prompt</h2><p class="prompt-meta" id="drawerMeta">修改后将生成新版本</p></div><button class="close" id="closeBtn">×</button></div><form id="form"><div class="field"><label>名称</label><input id="name" required /></div><div class="field"><label>类型</label><select id="type"><option value="system">系统 Prompt</option><option value="task">任务 Prompt</option></select></div><div class="field"><label>用途说明</label><input id="desc" required /></div><div class="field"><label>Prompt 内容</label><textarea id="content" required></textarea></div><div class="field"><label>状态</label><select id="enabledField"><option value="true">启用</option><option value="false">停用</option></select></div><div class="drawer-foot"><button type="button" class="secondary" id="cancelBtn">取消</button><button class="primary">保存并发布</button></div></form></div></div><div class="toast" id="toast">已保存</div>
<script>
const seed=[{id:1,name:'简历诊断主 Prompt',type:'system',desc:'控制整体诊断风格与输出边界',enabled:true,version:'v3.2',updated:'今天 10:24',content:'你是一名资深招聘顾问。请基于用户提供的简历和目标岗位，给出具体、可执行的诊断建议。不要编造经历，不要替用户做出最终决定。'},{id:2,name:'岗位匹配分析',type:'task',desc:'提取岗位要求并计算匹配证据',enabled:true,version:'v2.8',updated:'昨天 16:08',content:'请将简历经历与岗位要求逐条对齐，输出匹配证据、缺口和优先级。引用原文，不要使用无法验证的推断。'},{id:3,name:'经历改写助手',type:'task',desc:'把经历改写为结果导向的要点',enabled:true,version:'v1.9',updated:'9月 8日',content:'保留事实与数字，使用行动-情境-结果结构改写。每条不超过两行，先给改写结果，再说明改动理由。'},{id:4,name:'敏感信息保护',type:'system',desc:'拦截身份证、电话等不必要的敏感数据',enabled:false,version:'v1.4',updated:'9月 2日',content:'处理简历时不得主动要求或输出身份证号、银行卡号等敏感信息。发现时提醒用户脱敏。'}];
let prompts=JSON.parse(localStorage.getItem('resume-prompts')||'null')||seed;let editing=null;
const $=id=>document.getElementById(id);function render(){let q=$('search').value.toLowerCase(),sf=$('statusFilter').value,tf=$('typeFilter').value;let list=prompts.filter(p=>(!q||[p.name,p.desc,p.content].join(' ').toLowerCase().includes(q))&&(sf==='all'||(sf==='on'?p.enabled:!p.enabled))&&(tf==='all'||p.type===tf));$('rows').innerHTML=list.map(p=>`<tr><td><div class="prompt-name">${p.name}</div><div class="prompt-meta">${p.desc}</div></td><td><span class="tag ${p.type==='system'?'blue':''}">${p.type==='system'?'系统':'任务'}</span></td><td><span class="status ${p.enabled?'':'off'}"><span class="dot"></span>${p.enabled?'已启用':'已停用'}</span></td><td><span class="version">${p.version}</span></td><td class="prompt-meta">${p.updated}</td><td><div class="actions"><button class="iconbtn" onclick="edit(${p.id})">编辑</button><button class="iconbtn" onclick="toggle(${p.id})">${p.enabled?'停用':'启用'}</button></div></td></tr>`).join('');$('empty').style.display=list.length?'none':'block';$('total').textContent=prompts.length;$('enabled').textContent=prompts.filter(p=>p.enabled).length;$('changes').textContent=prompts.filter(p=>p.updated.includes('今天')||p.updated.includes('昨天')).length}
function edit(id){editing=prompts.find(p=>p.id===id);$('drawerTitle').textContent='编辑 Prompt';$('drawerMeta').textContent=`当前版本 ${editing.version} · 保存后生成新版本`;['name','type','desc','content'].forEach(k=>$(k).value=editing[k]);$('enabledField').value=String(editing.enabled);$('drawer').classList.add('open')}
function toggle(id){let p=prompts.find(x=>x.id===id);p.enabled=!p.enabled;p.updated='刚刚';localStorage.setItem('resume-prompts',JSON.stringify(prompts));render();show(p.enabled?'Prompt 已启用':'Prompt 已停用')}
function show(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('newBtn').onclick=()=>{editing=null;$('drawerTitle').textContent='新建 Prompt';$('drawerMeta').textContent='发布后立即加入工作区';$('form').reset();$('enabledField').value='true';$('drawer').classList.add('open')};$('closeBtn').onclick=$('cancelBtn').onclick=()=> $('drawer').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();let data={name:$('name').value,type:$('type').value,desc:$('desc').value,content:$('content').value,enabled:$('enabledField').value==='true',updated:'刚刚'};if(editing){Object.assign(editing,data);editing.version='v'+(parseFloat(editing.version.slice(1))+0.1).toFixed(1)}else{data.id=Date.now();data.version='v1.0';prompts.unshift(data)}localStorage.setItem('resume-prompts',JSON.stringify(prompts));$('drawer').classList.remove('open');render();show('已保存并发布')};['search','statusFilter','typeFilter'].forEach(id=>$(id).oninput=render);render();
</script></body></html>
