<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历专家 · Prompt 后台</title>
  <style>
    :root{--ink:#17202a;--muted:#718096;--line:#e7ebf0;--paper:#fff;--bg:#f6f8fb;--blue:#2563eb;--blue-soft:#eaf1ff;--green:#16845b;--red:#c2414d;--amber:#b7791f;--shadow:0 12px 34px rgba(24,38,62,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}
    .shell{display:flex;min-height:100vh}.side{width:236px;background:#101820;color:#b6c0cd;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;padding:0 12px 30px}.brand span{display:block;color:#8190a3;font-size:11px;font-weight:400;margin-top:3px}.nav{display:grid;gap:5px}.nav button{padding:11px 12px;text-align:left;border-radius:7px;color:#aeb9c8;width:100%}.nav button.active,.nav button:hover{background:#202e3d;color:#fff}.nav i{display:inline-block;width:22px;color:#8ca0b7;font-style:normal}.nav .badge{float:right;background:#2f4256;color:#cfe0f5;border-radius:99px;padding:1px 7px;font-size:11px;font-style:normal}
    .side-foot{margin-top:auto;padding:14px 12px;border-top:1px solid #26323e;color:#76879a;font-size:12px}.side-foot b{color:#9fb0c3;font-weight:600}
    .main{flex:1;min-width:0}.top{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;position:sticky;top:0;z-index:20}.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-weight:600}.account{display:flex;align-items:center;gap:10px}.avatar{width:30px;height:30px;border-radius:50%;background:#dce8ff;color:#2456b7;display:grid;place-items:center;font-weight:700}
    .wrap{padding:34px 38px;max-width:1450px}.headline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px;gap:16px}.headline h1{font-size:25px;margin:0 0 5px;letter-spacing:-.3px}.headline p{color:var(--muted);margin:0}
    .primary{background:var(--blue);color:#fff;border-radius:6px;padding:10px 16px;font-weight:600;box-shadow:0 4px 9px rgba(37,99,235,.18)}.primary:hover{background:#1d4ed8}.primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.secondary{border:1px solid #dce2ea;border-radius:6px;padding:9px 15px;color:#596778;background:#fff}.secondary:hover{background:#f7f9fb}.danger{border:1px solid #f0ccd0;border-radius:6px;padding:9px 15px;color:var(--red);background:#fff}.danger:hover{background:#fdf3f4}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:7px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:11px}.stat small.good{color:var(--green)}.stat small.warn{color:var(--amber)}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h2{margin:0;font-size:15px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .toolbar{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{position:relative;flex:1;min-width:220px}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid #dce2ea;border-radius:6px;outline:none}.search input:focus{border-color:#8eb0fa;box-shadow:0 0 0 3px var(--blue-soft)}.search span{position:absolute;left:12px;top:9px;color:#93a0b0}.filter{padding:9px 11px;border:1px solid #dce2ea;border-radius:6px;background:#fff;color:#4e5b6c}
    .table{width:100%;border-collapse:collapse}.table th{background:#fbfcfd;color:#8490a0;text-align:left;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:12px 18px;white-space:nowrap}.table td{border-top:1px solid #edf0f4;padding:15px 18px;vertical-align:middle}.table tr:hover td{background:#fbfdff}.prompt-name{font-weight:650;color:#1d2936}.prompt-meta{font-size:12px;color:var(--muted);margin-top:2px}.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;background:#f0f3f7;color:#5e6a78;font-size:11px;margin-right:4px}.tag.blue{background:#eaf1ff;color:#285bbc}.tag.green{background:#e8f6ef;color:#16845b}.tag.red{background:#fdeef0;color:#c2414d}.tag.amber{background:#fdf5e6;color:#a36a12}.tag.grey{background:#f0f3f7;color:#6b7684}
    .status{font-size:12px;display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.status.off{color:#8a96a4}.status.off .dot{background:#b5bec9}.version{color:#536171;font-variant-numeric:tabular-nums}.actions{display:flex;gap:5px;justify-content:flex-end;white-space:nowrap}.iconbtn{padding:6px 8px;border-radius:5px;color:#687587}.iconbtn:hover{background:#eef3fa;color:var(--blue)}.iconbtn.danger-text:hover{background:#fdeef0;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:45px}
    .drawer-wrap{position:fixed;inset:0;background:rgba(16,24,32,.35);display:none;justify-content:flex-end;z-index:50}.drawer-wrap.open{display:flex}.drawer{width:min(620px,100%);height:100%;background:#fff;padding:28px 30px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}.drawer.wide{width:min(880px,100%)}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:23px;gap:14px}.drawer h2{margin:0;font-size:20px}.close{font-size:24px;color:#8793a2;line-height:1}.field{margin-bottom:17px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px;color:#475467}.field input,.field textarea,.field select{width:100%;border:1px solid #dce2ea;border-radius:6px;padding:10px 11px;outline:none}.field textarea{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.65}.field input:focus,.field textarea:focus{border-color:#8eb0fa;box-shadow:0 0 0 3px var(--blue-soft)}.field .hint{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:10px}.field .hint.over{color:var(--red)}
    .drawer-foot{display:flex;justify-content:flex-end;gap:9px;padding-top:8px;position:sticky;bottom:0;background:#fff;padding-bottom:4px}
    .toast{position:fixed;bottom:24px;right:24px;background:#17202a;color:#fff;padding:11px 15px;border-radius:6px;box-shadow:var(--shadow);display:none;z-index:80;max-width:420px}.toast.show{display:block}.toast.err{background:#8c2f39}
    .banner{margin-bottom:20px;border-radius:8px;padding:14px 16px;font-size:13px;display:none;border:1px solid}.banner.show{display:block}.banner.error{background:#fdf3f4;border-color:#f0ccd0;color:#8c2f39}.banner.warn{background:#fdf9ef;border-color:#f0e0bd;color:#8a6414}
    .timeline{position:relative;padding-left:26px}.timeline:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e7ebf0}.tl-item{position:relative;padding:0 0 20px}.tl-item:before{content:'';position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:#c3cede;border:2px solid #fff}.tl-item.rollback:before{background:#e0a83c}.tl-item.delete:before{background:#d4717c}.tl-item.create:before{background:#5f9e7f}.tl-item.seed:before{background:#b7c2d0}.tl-body{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px}.tl-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.tl-title{font-weight:640}.tl-time{color:var(--muted);font-size:12px;white-space:nowrap}.tl-note{color:var(--muted);font-size:12px;margin-top:6px}
    .diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7}.diff .row{display:flex;gap:10px;padding:2px 12px;white-space:pre-wrap;word-break:break-all}.diff .row .sign{width:12px;color:#93a0b0;flex:none}.diff .row.add{background:#eaf7f0}.diff .row.add .sign{color:#16845b}.diff .row.del{background:#fdeef0}.diff .row.del .sign{color:#c2414d}.diff .row.same{color:#5a6675}
    .chart{width:100%;height:190px;display:block}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
    .bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}.bar-row .name{width:150px;flex:none;color:#475467}.bar-row .bar{flex:1;height:8px;border-radius:99px;background:#eef1f6;overflow:hidden}.bar-row .bar i{display:block;height:100%;background:#c2414d}.bar-row .num{width:60px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.kv .item{background:#fbfcfd;border:1px solid var(--line);border-radius:7px;padding:11px 13px}.kv .item label{display:block;font-size:11px;color:var(--muted)}.kv .item strong{font-size:14px;font-weight:600;display:block;margin-top:4px;word-break:break-all}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
    .vlist{display:grid;gap:8px}.vrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:11px 14px}.vrow .vver{font-weight:640;font-variant-numeric:tabular-nums}.vrow .vmeta{flex:1;min-width:0;color:var(--muted);font-size:12px}.vrow.current{border-color:#bcd2fb;background:#f7faff}
    .collapse{border:1px solid var(--line);border-radius:8px;margin-top:14px;overflow:hidden}.collapse>summary{padding:12px 15px;cursor:pointer;font-weight:600;font-size:13px;background:#fbfcfd;list-style:none}.collapse>summary::-webkit-details-marker{display:none}.collapse>summary:before{content:'▸';display:inline-block;margin-right:8px;color:#93a0b0;transition:transform .15s}.collapse[open]>summary:before{transform:rotate(90deg)}.collapse .inner{padding:15px}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 18px;background:#fbfcfd}.tabs button{padding:12px 14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
    .loading{padding:40px;text-align:center;color:var(--muted)}
    .test-form{padding:18px}.test-form textarea{min-height:150px}.test-actions{display:flex;justify-content:flex-end;gap:9px;align-items:center;flex-wrap:wrap}.privacy-note{margin-right:auto;color:var(--amber);font-size:12px;max-width:620px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding:18px}.result-card{border:1px solid var(--line);border-radius:8px;overflow:hidden}.result-card.failed{border-color:#f0ccd0}.result-card .result-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:#fbfcfd;border-bottom:1px solid var(--line)}.result-card .result-body{padding:15px}.resume-output{white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:13px;font-size:12px;line-height:1.7}.comparison{padding:15px 18px;border-top:1px solid var(--line);background:#fbfcfd}.case-list{display:grid;gap:8px;padding:14px 18px}.case-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:7px;padding:11px 13px}.case-row .case-main{flex:1;min-width:0}.run-status{font-weight:650}.run-status.ok{color:var(--green)}.run-status.fail{color:var(--red)}
    @media(max-width:900px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;padding:16px}.brand{padding-bottom:16px}.nav{grid-auto-flow:column;overflow:auto}.nav .badge{display:none}.side-foot{display:none}.top{padding:0 18px}.wrap{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3),.table td:nth-child(4),.table th:nth-child(4){display:none}.drawer{padding:22px 18px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">简历专家<span>Prompt 管理后台</span></div>
      <nav class="nav" id="nav">
        <button data-route="prompts"><i>▦</i><span>Prompt 总览</span></button>
        <button data-route="releases"><i>⇧</i><span>发布中心</span></button>
        <button data-route="tests"><i>⇄</i><span>Prompt 测试台</span></button>
        <button data-route="changes"><i>◷</i><span>变更记录</span></button>
        <button data-route="logs"><i>≣</i><span>运行日志</span></button>
        <button data-route="feedback"><i>✓</i><span>质量反馈</span></button>
        <button data-route="rules"><i>!</i><span>风险规则</span></button>
        <button data-route="dependencies"><i>→</i><span>流程依赖</span></button>
        <button data-route="settings"><i>⚙</i><span>项目设置</span></button>
      </nav>
      <div class="side-foot">Workspace · resume-expert<br />数据存储：<b>服务端 data/</b></div>
    </aside>
    <main class="main">
      <header class="top">
        <div class="crumb">工作区 / <b id="crumb">Prompt 总览</b></div>
        <div class="account"><span id="accountName">未登录</span><span class="tag" id="accountRole">访客</span><button class="iconbtn" id="logoutBtn" style="display:none">退出</button><div class="avatar" id="accountAvatar">访</div></div>
      </header>
      <div class="wrap">
        <div class="banner error" id="connBanner"></div>
        <div id="page"></div>
      </div>
    </main>
  </div>
  <div class="drawer-wrap" id="drawer"><div class="drawer" id="drawerBody"></div></div>
  <div class="toast" id="toast">已保存</div>
  <script src="admin.js"></script>
</body>
</html>
